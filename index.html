<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Simple utility apps from Vasser Studios.">
  <title>Vasser Studios</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0b0b0b; color: #f5f2ed; font: 17px/1.7 system-ui, sans-serif; }
    main { max-width: 820px; padding: 72px 24px; margin: auto; }
    .eyebrow { color: #ff7800; font-size: 13px; letter-spacing: .12em; text-transform: uppercase; }
    h1 { font-size: clamp(40px, 9vw, 64px); margin: 12px 0; line-height: 1.15; letter-spacing: -2px; }
    .intro { color: #beb7af; margin-bottom: 48px; }
    article { border: 1px solid #3c332b; border-top: 4px solid #ff7800; padding: 28px; border-radius: 8px; }
    h2 { margin: 0 0 12px; font-size: 25px; line-height: 1.3; }
    article p { color: #beb7af; }
    a { color: #ffa04d; text-underline-offset: 4px; overflow-wrap: anywhere; }
    a:focus-visible { outline: 2px solid #ff7800; outline-offset: 4px; }
    footer { border-top: 1px solid #3c332b; margin-top: 48px; padding-top: 24px; font-size: 14px; color: #beb7af; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Simple tools for everyday tasks</p>
    <h1>Vasser Studios</h1>
    <p class="intro">Small, focused utility apps.</p>
    <article>
      <h2>Calorie to Kilojoules</h2>
      <p>Convert food calories (kcal) and kilojoules (kJ) instantly, in either direction.</p>
      <a href="/vspolicies/calorie-to-kilojoules/">Read the privacy policy</a>
    </article>
    <footer>
      <p>Support and privacy enquiries: <a href="mailto:vasserstudios@hotmail.com">vasserstudios@hotmail.com</a></p>
      <a href="/vspolicies/">All privacy policies</a>
    </footer>
  </main>
</body>
</html>
